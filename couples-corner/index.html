<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Couples Corner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
        <div id="app">

        <!-- Header -->
        <div id="header">
            <h1>Couples Corner</h1>
            <p id="status">Welcome back</p>
        </div>
        
        <!-- Mood Light Left -->
            <div class="mood-light-wrapper" id="mood-light-wrapper-left">
                <div class="light-fixture">
                    <div class="light-base"></div>
                    <div class="light-dome" id="mood-dome-left"></div>
                </div>
                <p class="mood-nameplate" id="mood-nameplate-left">...</p>
            </div>

        <!-- Mood Light Right -->
        <div class="mood-light-wrapper" id="mood-light-wrapper-right">
                <div class="light-fixture">
                    <div class="light-base"></div>
                    <div class="light-dome" id="mood-dome-right"></div>
                </div>
                <p class="mood-nameplate" id="mood-nameplate-right">...</p>
            </div>

            
        <!-- Main Room -->
        <div id="room">

            <!-- Window -->
            <div class="window-wrapper" id="window-wrapper-left">
                <div class="window" id="window-left">
                    <img class="weather-gif" id="weather-gif-left" src="assets/sunny.png" alt="weather">
                    <p class="temperature" id="temp-left">--°F</p>
                </div>
                <div class="location-bar">
                    <p class="location-display" id="location-display-left">Loading...</p>
                    <button class="location-btn" id="location-btn-left">Change</button>
                    <input class="location-input hidden" id="location-input-left" type="text" placeholder="Enter city...">
                </div>
                <div class="record-player" id="record-player">
                    <img src="assets/record-player.png" alt="record player">
                </div>
            </div>

           

           <div id="fireplace-wrapper">
            
            <!-- Picture Frame-->
            <div id="picture-frame">
                <div id="picture-in-frame">
                    <img src="assets/Vert_Tester.jpg" alt="picture in frame">
                </div>
            </div>

            <!-- Upload Panel -->
            <div id="upload-panel" class="hidden">
                <input type="file" id="photo-upload" accept="image/*">
                <button id="upload-btn">Upload</button>
                <button id="view-album-btn">View Album</button>
                <button id="close-upload-btn">Cancel</button>
            </div>
            
            <!-- Gallery Panel -->
            <div id="gallery-panel" class="hidden">
                <div id="gallery-header">
                    <h3>Our Album</h3>
                    <button id="close-gallery-btn">✕</button>
                </div>
                <div id="gallery-grid"></div>
            </div>

                <!-- Mantel -->
                <div id="mantel">
                    <div id="stack-of-books">
                        <img src="assets/stack_of_books.png" alt="stack of books">
                    </div>
                <div id="globe">
                    <img src="assets/spinning_globe.gif" alt="spinning globe">
                </div>
            </div>

            <!-- Fireplace -->
            <div id="fireplace">
                <div id="fireplace-interior">
                    <div id="logs">
                        <div class="log log-back"></div>
                        <div class="log log-front"></div>
                    </div>
                    <div id="flames" class="hidden">
                        <div class="flame flame-1"></div>
                        <div class="flame flame-2"></div>
                        <div class="flame flame-3"></div>
                    </div>
                </div>
            </div>

        </div>
        

        

        <!-- Second Window-->
            <div class="window-wrapper" id="window-wrapper-right">
                <div class="window" id="window-right">
                    <img class="weather-gif" id="weather-gif-right" src="assets/cloudy.png" alt="weather">
                    <p class="temperature" id="temp-right">--°F</p>
                </div>
                <div class="location-bar">
                    <p class="location-display" id="location-display-right">Loading...</p>
                    <button class="location-btn" id="location-btn-right">Change</button>
                    <input class="location-input hidden" id="location-input-right" type="text" placeholder="Enter city...">
                </div>
            </div>

        
            <!-- Mood Panel -->
            <div id="mood-panel" class="hidden">
                <div id="mood-panel-inner">
                    <div id="mood-panel-header">
                        <h3>How are you feeling?</h3>
                        <button id="close-mood-panel">✕</button>
                    </div>
                    <div id="mood-grid"></div>
                </div>
            </div>

        </div>

        
        <!-- Music Recommendation Modal -->
         <div id="music-modal" class="hidden">
            
            <!-- Modal Header -->
            <div id="music-header">
                <h2>Heartfelt Tunes</h2>
                <button id="close-music-btn">✕</button>
            </div>
            
            <!-- DJ Light Rig -->
            <div id="light-rig">
                <div class="dj-light">
                    <div class="light-head delay-0"></div>
                    <div class="light-beam left-beam delay-0"></div>
                </div>
                <div class="dj-light">
                    <div class="light-head delay-1"></div>
                    <div class="light-beam left-beam delay-1"></div>
                </div>
                <div class="dj-light">
                    <div class="light-head delay-2"></div>
                    <div class="light-beam left-beam delay-2"></div>
                </div>
                <div class="dj-light">
                    <div class="light-head delay-3"></div>
                    <div class="light-beam left-beam delay-3"></div>
                </div>
                <div class="dj-light">
                    <div class="light-head delay-0"></div>
                    <div class="light-beam right-beam delay-0"></div>
                </div>
                <div class="dj-light">
                    <div class="light-head delay-1"></div>
                    <div class="light-beam right-beam delay-1"></div>
                </div>
                <div class="dj-light">
                    <div class="light-head delay-2"></div>
                    <div class="light-beam right-beam delay-2"></div>
                </div>
                <div class="dj-light">
                    <div class="light-head delay-3"></div>
                    <div class="light-beam right-beam delay-3"></div>
                </div>
            </div>

            <!-- Vinyl Discs -->
            <div id="vinyl-section">
                <!-- Left Disc -->
                <div class="vinyl-wrapper" id="vinyl-left-wrapper">
                    <div class="vinyl-disc" id="vinyl-left">
                        <div class="vinyl-label" id="vinyl-label-left">
                            <p class="vinyl-title">Pick a song</p>
                        </div>
                    </div>
                    <div class="name-plate" id="name-plate-left">
                        <span id="name-plate-text-left">Your Name</span>
                        <button class="name-plate-edit" id="name-plate-edit-left">✎</button>
                        <input class="name-plate-input hidden" id="name-plate-input-left" type="text" placeholder="Enter name...">
                    </div>
                    <button class="vinyl-search-btn" id="search-btn-left">Search Song</button>
                    <button class="vinyl-add-btn hidden" id="add-btn-left">+ Add to Playlist</button>
                </div>

                <!-- Right Disc -->
                <div class="vinyl-wrapper" id="vinyl-right-wrapper">
                    <div class="vinyl-disc" id="vinyl-right">
                        <div class="vinyl-label" id="vinyl-label-right">
                            <p class="vinyl-title">Pick a song</p>
                        </div>
                    </div>
                    <div class="name-plate" id="name-plate-right">
                        <span id="name-plate-text-right">Your Name</span>
                        <button class="name-plate-edit" id="name-plate-edit-right">✎</button>
                        <input class="name-plate-input hidden" id="name-plate-input-right" type="text" placeholder="Enter name...">
                    </div>
                    <button class="vinyl-search-btn" id="search-btn-right">Search Song</button>
                    <button class="vinyl-add-btn hidden" id="add-btn-right">+ Add to Playlist</button>
                </div>

                 
            </div>

            <!-- Search Panel -->
            <div id="music-search-panel" class="hidden">
                <div id="music-search-bar">
                    <input type="text" id="music-search-input" placeholder="Search song or artist...">
                    <button id="music-search-btn">Search</button>
                    <button id="music-search-close">✕</button>
                </div>
                <div id="music-search-results"></div>
            </div>

            <!-- Joint Playlist -->
            <div id="joint-playlist">
                <h3>Our Playlist</h3>
                <div id="playlist-list"></div>
            </div>

        </div>

            </div>
         </div>

        <!-- Books Modal -->
        <div id="books-modal" class="hidden">
            
            <!-- Modal Header -->
            <div id="books-header">
                <h2>Our Reading Corner</h2>
                <button id="close-books-btn">✕</button>
            </div>

            <!-- Tabs -->
            <div id="books-tabs">
                <button class="tab-btn active" data-tab="recommended">Recommended</button>
                <button class="tab-btn" data-tab="inprogress">In Progress</button>
                <button class="tab-btn" data-tab="completed">Completed</button>
            </div>

            <!-- Tab Content -->
            <div id="books-content">

                <!-- Recommended Tab -->
                <div class="tab-panel active" id="tab-recommended">
                    <div id="search-bar">
                        <input type="text" id="book-search-input" placeholder="Search by title or author...">
                        <button id="book-search-btn">Search</button>
                    </div>
                    <div id="search-results"></div>
                    <div id="recommended-list"></div>
                </div>

                <!-- In Progress Tab -->
                <div class="tab-panel hidden" id="tab-inprogress">
                    <div id="inprogress-list"></div>
                </div>

                <!-- Completed Tab -->
                <div class="tab-panel hidden" id="tab-completed">
                    <div id="completed-list"></div>
                </div>

            </div>

        </div>

        <!-- Name Entry Modal -->
        <div id="name-modal" class="hidden">
            <div id="name-modal-inner">
                <h2>Welcome to Couples Corner</h2>
                <p>What should we call you?</p>
                <input type="text" id="name-input" placeholder="Enter your name...">
                <button id="name-submit-btn">Enter</button>
            </div>
        </div>
    </div>

    
    <!-- Firebase SDKs -->
    <script type="module" src="app.js"></script>
</body>
</html>
