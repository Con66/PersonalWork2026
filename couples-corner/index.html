<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Couples Corner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
        <div id="app">

        <!-- Header -->
        <div id="header">
            <h1>Couples Corner</h1>
            <p id="status">Welcome back</p>
        </div>

        <!-- Main Room -->
        <div id="room">

            <!-- Window -->
            <div class="window-wrapper" id="window-wrapper-left">
                <div class="window" id="window-left">
                    <img class="weather-gif" id="weather-gif-left" src="assets/sunny.png" alt="weather">
                    <p class="temperature" id="temp-left">--°F</p>
                </div>
                <div class="location-bar">
                    <p class="location-display" id="location-display-left">Loading...</p>
                    <button class="location-btn" id="location-btn-left">Change</button>
                    <input class="location-input hidden" id="location-input-left" type="text" placeholder="Enter city...">
                </div>
            </div>

            

           <div id="fireplace-wrapper">
            
            <!-- Picture Frame-->
            <div id="picture-frame">
                <div id="picture-in-frame">
                    <img src="assets/Vert_Tester.jpg" alt="picture in frame">
                </div>
            </div>

                <!-- Mantel -->
                <div id="mantel">
                    <div id="stack-of-books">
                        <img src="assets/stack_of_books.png" alt="picture frame">
                    </div>
                <div id="globe">
                    <img src="assets/spinning_globe.gif" alt="spinning globe">
                </div>
            </div>

            <!-- Fireplace -->
            <div id="fireplace">
                <div id="fireplace-interior">
                    <div id="logs">
                        <div class="log log-back"></div>
                        <div class="log log-front"></div>
                    </div>
                    <div id="flames" class="hidden">
                        <div class="flame flame-1"></div>
                        <div class="flame flame-2"></div>
                        <div class="flame flame-3"></div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Second Window-->
            <div class="window-wrapper" id="window-wrapper-right">
                <div class="window" id="window-right">
                    <img class="weather-gif" id="weather-gif-right" src="assets/cloudy.png" alt="weather">
                    <p class="temperature" id="temp-right">--°F</p>
                </div>
                <div class="location-bar">
                    <p class="location-display" id="location-display-right">Loading...</p>
                    <button class="location-btn" id="location-btn-right">Change</button>
                    <input class="location-input hidden" id="location-input-right" type="text" placeholder="Enter city...">
                </div>
            </div>

            

        </div>

        <!-- Controls -->
        <div id="controls">
            
            <button id="weather-btn">Toggle Weather</button>
        </div>

    </div>

    
    <!-- Firebase SDKs -->
    <script type="module" src="app.js"></script>
</body>
</html>
